name: Align schema mass evidence

on:
  push:
    branches:
      - agent/align-schema-mass-evidence

permissions:
  contents: write

jobs:
  patch-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/align-schema-mass-evidence
          fetch-depth: 0
      - name: Align technical schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('technical-schema.md')
          text = path.read_text()

          replacements = [
              (
                  "manufacturer_certification_statement\ncertificate_reviewed\npublished_geometry",
                  "manufacturer_certification_statement\ncertificate_reviewed\nqualified_secondary_exact_sku\npublished_geometry",
              ),
              (
                  "| `mass_kg` | DECIMAL(12,6) | yes | Current accepted manufacturer-backed mass |",
                  "| `mass_kg` | DECIMAL(12,6) | yes | Current accepted evidence-qualified physical mass |",
              ),
              (
                  "- A non-null operational `mass_kg` used by recommendation logic must have a matching `accepted_fact_link` to an accepted manufacturer-backed Claim.",
                  "- A non-null operational `mass_kg` used by recommendation logic must have a matching `accepted_fact_link` to an accepted Claim supported by evidence permitted for physical mass. Manufacturer evidence is preferred; a reputable verified exact-SKU secondary source may be accepted when manufacturer mass is unavailable or incomplete.",
              ),
              (
                  "- claim_id = <accepted manufacturer mass claim>",
                  "- claim_id = <accepted evidence-qualified mass claim>",
              ),
              (
                  "4. At least one Evidence row for that Claim must trace to acceptable manufacturer information.\n5. For a particular recommendation path, sufficient physical-interface information must exist to establish a valid tool-side connection directly or through a ToolAttachment.",
                  "4. At least one Evidence row for that Claim must satisfy the physical-mass evidence policy: manufacturer evidence is preferred; a reputable verified exact-SKU secondary source may be accepted when manufacturer mass is unavailable or incomplete.\n5. For a particular recommendation path, sufficient physical-interface information must exist to establish a valid tool-side connection directly or through a ToolAttachment.",
              ),
              (
                  "## 13.4 Manufacturer-source validation\n\nFor mandatory tool mass and rated capacity, acceptable supporting Source types are initially:\n\n```text\nmanufacturer_datasheet\nmanufacturer_webpage\nmanufacturer_manual\nmanufacturer_declaration\n```\n\nA manufacturer compatibility statement may support compatibility/relationship Claims but should not automatically be treated as the source of a rated load unless it actually states that rating and the review process accepts it as manufacturer technical information.\n\nInternal measurement is acceptable for geometry but not as the normal source of tool mass or manufacturer-rated component capacity.",
                  "## 13.4 Property-specific source validation\n\nFor physical tool or battery mass, manufacturer evidence is preferred. Acceptable manufacturer Source types are initially:\n\n```text\nmanufacturer_datasheet\nmanufacturer_webpage\nmanufacturer_manual\nmanufacturer_declaration\n```\n\nWhere manufacturer mass is unavailable or incomplete, `secondary_published` may support an accepted physical-mass Claim when the resolved source is reputable, verified against the exact SKU/model, and recorded with `evidence_method = qualified_secondary_exact_sku`. Secondary mass must never be represented as manufacturer-stated evidence.\n\nFor rated capacity of Tethers, ToolAttachments, AnchorAttachments, and Containers, manufacturer evidence remains mandatory. A manufacturer compatibility statement may support compatibility/relationship Claims but should not automatically be treated as the source of a rated load unless it actually states that rating and the review process accepts it as manufacturer technical information.\n\nInternal measurement is acceptable for geometry but not as the normal source of catalogue tool mass or manufacturer-rated component capacity.",
              ),
              (
                  "- mandatory mass/capacity Claims have acceptable manufacturer evidence;",
                  "- mandatory tool-mass Claims satisfy the physical-mass evidence policy, and rated-capacity Claims have acceptable manufacturer evidence;",
              ),
              (
                  "2. Tool mass and component capacity are queryable directly and traceable to accepted manufacturer-backed Claims.",
                  "2. Tool mass is queryable directly and traceable to an accepted evidence-qualified Claim, while component capacity is queryable directly and traceable to an accepted manufacturer-backed Claim.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:90]!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/align-schema-mass-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-schema.md .github/workflows/align-schema-mass-evidence.yml
          git commit -m "Align technical schema mass evidence policy"
          git push origin HEAD:agent/align-schema-mass-evidence
