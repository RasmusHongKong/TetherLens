name: Ingestion live smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ingestion-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q
      - name: Run live manufacturer benchmark
        run: python scripts/run_batch1_smoke.py
      - name: Score Batch 1 against golden expectations
        run: python scripts/score_batch1_results.py
      - name: Score immutable Batch 2 blind baseline
        run: python scripts/score_batch2_nlg_results.py --write-scored batch2-nlg-blind-score.json
      - name: Run Batch 2 NLG post-blind evaluation
        run: python scripts/run_batch2_nlg_evaluation.py
      - name: Score Batch 2 post-blind evaluation
        run: python scripts/score_batch2_nlg_results.py batch2-nlg-evaluation-results.json --write-scored batch2-nlg-evaluation-score.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-benchmark-results
          path: |
            batch1-benchmark-results.json
            batch2-nlg-blind-score.json
            batch2-nlg-evaluation-results.json
            batch2-nlg-evaluation-score.json
          if-no-files-found: warn
