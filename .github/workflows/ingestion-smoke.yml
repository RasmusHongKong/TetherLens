name: Ingestion live smoke

on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q
      - name: Run live manufacturer smoke test
        run: python scripts/run_batch1_smoke.py
