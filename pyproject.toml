[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetherlens-ingest"
version = "0.1.0"
description = "Manufacturer ingestion benchmark for TetherLens"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=6.0",
]

[project.scripts]
tetherlens-ingest = "tetherlens_ingest.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
